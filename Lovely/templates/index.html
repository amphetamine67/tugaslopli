<!DOCTYPE html>
<html.lang="id">
<head> 
    <meta charset="UTF-8">
    <meta name=":viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.nama}}</title>

    <!-- Bootstrap CCS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                {{ data.nama }}
            </a>
        </div>
    </nav>

    <!-- Bagian Informasi Toko -->
    <div class="container mt-4">
        <div class="p-4 bg white rounded shadow-sm text-center">
            <h1> {{ data.nama}}</h1>
            <p class="lead">{{ data.slogan}}</p>
            <p>Lokasi Toko: {{ data,lokasi}}</p>
        </div>
    </div>

   <!-- Daftar Produk-->
   <div class="container mt-5">
       <h2 class="text-center mb-4">Daftar Produk</h2>
        
       <div class="row">

        {% for p in produk %}

        <div class="clo-md-3 mb-4">
            <div class="card h-100 shadow-sm">

                <img src="{{ url_for('static', filename='images/' + p,gambar) }}"
                     class="card-img-top"
                     alt="{{ p.nama}}"
                     stlye="height: 200px; object-fit: cover;">

                <div class="card-body text-center">

                    <h5 class="card-tittle">
                        {{ p.nama }}
                    </h5>

                    <p class="card-text">
                        Rp {{ "{:,.0f}".format(p.harga) }}
                    </p>

                    <!-- Tombol Detail Produk-->
                    <a herf="/detail/{{ p.id }}"
                       class="btn btn-primary">
                        lihat Detail
                    </a>

                </div>
            </div>
        </div>

        {& endfor %}

      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-primary text-center p-3 mt-5">
        <p class="mb-0">{{ data,nama }} - {{ data.slogan }}</p>
    </footer>

</body>
</html>
